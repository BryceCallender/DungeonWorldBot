# Builds everything and runs the tests on every pull request and push to main. The build treats warnings as errors,
# so this also catches analyzer and style problems.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The dashboard bundles its canvas scripts with npm as part of dotnet build
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/DungeonWorldBot.Dashboard/package-lock.json

      - name: Restore
        run: dotnet restore DungeonWorldBot.slnx

      - name: Build
        run: dotnet build DungeonWorldBot.slnx --no-restore --configuration Release

      - name: Type-check canvas scripts
        working-directory: src/DungeonWorldBot.Dashboard
        run: npm run check

      - name: Test
        run: dotnet test tests/DungeonWorldBot.Tests --no-build --configuration Release --logger "console;verbosity=normal"
